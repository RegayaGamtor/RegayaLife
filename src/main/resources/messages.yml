admin-revived: "&a{player} berhasil di-revive dengan {hearts} heart."
admin-reset: "&aHeart &f{player} &adikembalikan ke default (&c{hearts}&a)."
admin-given: "&aMemberikan {amount}x {item} kepada &f{player}&a."

history-error: "&cGagal membaca riwayat eliminasi. Lihat console."
history-empty: "&7{player} belum pernah tereliminasi."
history-header: "&6&l--- Riwayat Eliminasi {player} ---"
history-line: "&7{date} &8- &f{cause} &7(pembunuh: &f{killer}&7)"

